global:
  scrape_interval: 5s      # curto de propósito: um "dia" simulado dura ~4 s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  - job_name: api-credito
    static_configs:
      - targets: ["api:8000"]

  - job_name: monitor-drift
    static_configs:
      - targets: ["simulador:8001"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
