name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Instalar dependências
        run: |
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Testes (pytest)
        run: pytest
      - name: Dashboard gerado está atualizado
        run: |
          python scripts/gerar_dashboard.py
          git diff --exit-code infra/grafana/dashboards/monitoramento.json
